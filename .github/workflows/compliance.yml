name: Compliance

on:
    pull_request:
    push:
        branches: [main]

permissions:
    contents: read

jobs:
    secrets:
        name: Secrets (gitleaks)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - name: Scan the full history for secrets
              env:
                  GITLEAKS_VERSION: 8.30.1
                  # SHA-256 of the linux_x64 tarball, from gitleaks_<version>_checksums.txt on the
                  # release. Update both together.
                  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
              run: |
                  tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
                  curl -sSfL -o "$tarball" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
                  echo "$GITLEAKS_SHA256  $tarball" | sha256sum -c -
                  tar xzf "$tarball" gitleaks
                  ./gitleaks git . --no-banner --redact --verbose

    licenses:
        name: Licenses of bundled dependencies
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v5
              with:
                  # pluggable-widgets-tools 11.12 requires >=22.18.0 <23.
                  node-version: 22
                  cache: npm
            - run: npm ci
            # Dual licenses pass when one option is allowed (e.g. "MIT OR CC0-1.0").
            # Exact version: npx installs it without a lockfile.
            - name: Check licenses
              run: >
                  npx --yes license-checker-rseidelsohn@4.4.2 --production --excludePrivatePackages
                  --excludePackagesStartingWith "@mendix/;reactemail@" --onlyAllow
                  "MIT;MIT-0;ISC;BSD-2-Clause;BSD-3-Clause;0BSD;Apache-2.0;Python-2.0;CC0-1.0;BlueOak-1.0.0"
