name: CI

on:
    pull_request:
    push:
        branches: [main]

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v5
              with:
                  # pluggable-widgets-tools 11.12 requires >=22.18.0 <23.
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npm run lint
            - run: npm test
            # Lints again, builds the .mpk, and (postrelease) checks it ships LICENSE and dependencies.txt.
            - run: npm run release
            - uses: actions/upload-artifact@v7
              with:
                  name: widget-mpk
                  path: dist/*/*.mpk
