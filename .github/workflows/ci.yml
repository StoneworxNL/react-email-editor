name: CI

on:
    pull_request:
    push:
        branches: [main]

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  # pluggable-widgets-tools 11.12 requires >=22.18.0 <23.
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npm run lint
            - run: npm test
            # Lints again and builds the .mpk.
            - run: npm run release
            - uses: actions/upload-artifact@v5
              with:
                  name: widget-mpk
                  path: dist/*/*.mpk
